<!DOCTYPE html>

<head>

<title>BAJATROY Power Station Reviews</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #0a1628;
    color: #e8ecf1;
    padding: 24px;
    min-height: 100vh;
  }
  .bt-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:16px; }
  .bt-logo { display:flex; align-items:center; gap:14px; }
  .bt-logo-img { width:56px; height:56px; border-radius:50%; object-fit:cover; border:2px solid #2a3f5f; box-shadow:0 2px 8px rgba(0,0,0,0.4); }
  .bt-logo-text { font-size:22px; font-weight:600; letter-spacing:0.5px; color:#e8ecf1; }
  .bt-logo-sub { font-size:12px; color:#7a8fa8; letter-spacing:1.5px; text-transform:uppercase; margin-top:-2px; }
  .bt-nav { display:flex; gap:8px; flex-wrap:wrap; }
  .bt-nav-btn {
    padding:8px 16px; border-radius:20px; border:1px solid #2a3f5f;
    background:transparent; color:#7a8fa8; font-size:14px; font-weight:500;
    cursor:pointer; transition:all 0.2s ease; font-family:inherit;
  }
  .bt-nav-btn:hover { background:#132238; color:#e8ecf1; }
  .bt-nav-btn.active { background:#1abc9c; color:#0a1628; border-color:#1abc9c; }
  .bt-card-wrap { position:relative; max-width:900px; margin:0 auto; }
  .bt-card {
    border-radius:12px; border:1px solid #1e3a5f;
    padding:24px; background:#0f1f35;
    position:relative; overflow:hidden;
  }
  .bt-card-bg {
    position:absolute; inset:0; border-radius:12px; opacity:0.4; pointer-events:none;
    background:
      radial-gradient(ellipse at 85% 15%, rgba(26,188,156,0.08) 0%, transparent 55%),
      radial-gradient(ellipse at 15% 85%, rgba(52,152,219,0.06) 0%, transparent 55%);
  }
  .bt-card-inner { position:relative; z-index:1; }
  .bt-card-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; flex-wrap:wrap; gap:12px; }
  .bt-name { font-size:22px; font-weight:600; color:#e8ecf1; margin:0; }
  .bt-tag { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:600; }
  .bt-tag.lifepo4 { background:rgba(46,204,113,0.15); color:#2ecc71; }
  .bt-tag.lion { background:rgba(241,196,15,0.15); color:#f1c40f; }
  .bt-tag.best { background:rgba(26,188,156,0.15); color:#1abc9c; }
  .bt-price-row { display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
  .bt-price { font-size:32px; font-weight:600; color:#e8ecf1; font-variant-numeric:tabular-nums; }
  .bt-price-note { font-size:13px; color:#7a8fa8; }
  .bt-rating { display:flex; gap:3px; margin-bottom:16px; }
  .bt-rating svg { width:16px; height:16px; }
  .bt-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin-bottom:16px; }
  .bt-spec { padding:12px; border-radius:10px; background:#0a1628; border:1px solid #1e3a5f; }
  .bt-spec-label { font-size:12px; color:#7a8fa8; margin-bottom:4px; text-transform:lowercase; }
  .bt-spec-value { font-size:15px; font-weight:500; color:#e8ecf1; }
  .bt-spec-value.highlight { color:#1abc9c; }
  .bt-highlights { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .bt-hl { padding:6px 12px; border-radius:6px; background:#132238; font-size:13px; color:#7a8fa8; display:flex; align-items:center; gap:6px; }
  .bt-hl svg { width:14px; height:14px; color:#2ecc71; }
  .bt-arrows { display:flex; justify-content:space-between; align-items:center; margin-top:16px; }
  .bt-arrow {
    width:40px; height:40px; border-radius:20px; border:1px solid #2a3f5f;
    background:#0f1f35; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all 0.2s ease; color:#7a8fa8;
  }
  .bt-arrow:hover { background:#132238; color:#e8ecf1; }
  .bt-arrow svg { width:20px; height:20px; }
  .bt-counter { font-size:14px; color:#7a8fa8; font-variant-numeric:tabular-nums; }
  .bt-progress { height:3px; border-radius:2px; background:#132238; margin-top:16px; overflow:hidden; }
  .bt-progress-bar { height:100%; border-radius:2px; background:#1abc9c; transition:width 0.3s ease; }
  @media (max-width:520px) { .bt-grid { grid-template-columns:1fr; } .bt-header { flex-direction:column; align-items:flex-start; gap:12px; } }
</style>
</head>
